[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docs-extraction"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic[mcp]>=0.25",
    "mcp>=1.8",
    "mammoth>=1.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
]

[project.scripts]
docs-extraction = "pipeline.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/pipeline --cov-report=term-missing --cov-fail-under=65"

[tool.coverage.run]
omit = ["src/pipeline/main.py"]
