[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "docs-extraction"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "anthropic[mcp]>=0.25",
    "mcp>=1.8,<2.0",
    "mammoth>=1.6",
    "arize-phoenix>=4.0",
    "arize-phoenix-otel>=0.6",
    "openinference-instrumentation-anthropic>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    "hypothesis>=6.0",
]

[project.scripts]
docs-extraction = "pipeline.main:main"
docs-extraction-eval = "eval.eval_main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=src/pipeline --cov-report=term-missing --cov-fail-under=65"

[tool.coverage.run]
omit = ["src/pipeline/main.py"]
